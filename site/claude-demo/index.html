<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal</title>
<style>/*CSS*/
:root { --bg: #fbfbf8; --ink: #1d1d1f; --quiet: #6e6e73; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101012; --ink: #f4f4f5; --quiet: #8b8b93; } }
:root[data-theme="dark"] { --bg: #101012; --ink: #f4f4f5; --quiet: #8b8b93; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
p { color: var(--quiet); }
button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>Signal</h1>
<p>A synthesizer to learn by patching, for the Arcade. Cables, knobs, ten short lessons, and your computer’s keyboard as the piano.</p>
<button type="button" data-open>Open Signal</button>
</main>
<script>/*JS*/</script>
</body>
</html>
